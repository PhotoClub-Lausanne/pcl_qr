<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Code Generator</title>
  <script src="https://unpkg.com/qr-code-styling"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 40px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: inline-block;
    }

    input, select, button {
      margin: 10px;
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }

    #qr {
      margin-top: 20px;
    }

    button {
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>PCL QR Code Generator</h2>

    <input type="text" id="url" placeholder="Entrez URL" />
    <br />

    <select id="style">
      <option value="square">Square</option>
      <option value="rounded">Rounded</option>
      <option value="dots">Points</option>
      <option value="classy">Classy</option>
    </select>
    <br />

    <button onclick="generateQR()">Générer QR Code</button>
    <button onclick="downloadQR()">Télécharger</button>

    <div id="qr"></div>
  </div>

  <script>
    let qrCode;

    function getDotType(style) {
      switch(style) {
        case 'rounded': return 'rounded';
        case 'dots': return 'dots';
        case 'classy': return 'classy';
        default: return 'square';
      }
    }

    function generateQR() {
      const url = document.getElementById('url').value;
      const style = document.getElementById('style').value;

      if (!url) {
        alert('Please enter a URL');
        return;
      }

      document.getElementById('qr').innerHTML = '';

      qrCode = new QRCodeStyling({
        width: 300,
        height: 300,
        data: url,
        image: "logo_pcl.jpg",
        dotsOptions: {
          type: getDotType(style)
        },
        imageOptions: {
          crossOrigin: "anonymous",
          margin: 5
        }
      });

      qrCode.append(document.getElementById('qr'));
    }

    function downloadQR() {
      if (qrCode) {
        qrCode.download({ name: "qr-code", extension: "png" });
      } else {
        alert("Generate a QR code first!");
      }
    }
  </script>
</body>
</html>
